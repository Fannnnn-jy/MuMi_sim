[project]
name = "drqv2"
version = "0.1.0"
description = "DrQ-v2 training code for LumiGrasp light-difference image observations."
requires-python = ">=3.10,<3.13"
dependencies = [
    "hydra-core>=1.3.2,<1.4",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "mitsuba>=3.8.0,<4",
    "mujoco>=3.8.1,<3.9",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.11.0",
    "pandas>=2.2.0",
    "robosuite>=1.5.2,<2",
    "termcolor>=2.5.0",
    "tensorboard>=2.19.0",
    "torch>=2.6.0",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "matplotlib>=3.10.0",
    "yapf>=0.43.0",
]

[tool.uv]
package = false
