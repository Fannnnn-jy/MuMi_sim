defaults:
  - _self_

# environment settings
action_repeat: ${env.action_repeat}
discount: 0.99
env:
  mumi_sim_root: /home/ubuntu/Junyi/LumiGrasp/mumi_sim
  width: 84
  height: 84
  samples: 128
  camera_name: agentview
  action_repeat: 1
  horizon: 200
  control_freq: 20
  seed: ${seed}
  use_gpu: true
  robot_asset_dir: /home/ubuntu/Junyi/LumiGrasp/mumi_sim/assets/robot_asset/franka_emika_panda
  robosuite_asset_dir: /home/ubuntu/Junyi/LumiGrasp/mumi_sim/assets/robosuite_assets
  gripper_light_config_path: /home/ubuntu/Junyi/LumiGrasp/mumi_sim/configs/gripper_light.json
  observation_exposure: 0.5
  light_diff_exposure: 0.5
  depth_min: 0.0
  depth_max: 2.0
  depth_invert: true
  cube_x_range: [-0.05, 0.05]
  cube_y_range: [-0.05, 0.05]
  cube_rotation_range: [-0.5, 0.5]
  cube_reference_pos: [0.0, 0.0, 0.8]
  cube_z_offset: 0.01
  robot_initialization_noise: 0.0
  mitsuba_flush_interval: 1000
  # observation_mode: ???
  observation_mode: rgb_stack
  frame_stack: 3
# train settings
num_train_frames: 1000000
num_seed_frames: 4000
# eval
eval_every_frames: 5000
num_eval_episodes: 10
# snapshot
save_snapshot: true
# replay buffer
replay_buffer_size: 1000000
replay_buffer_num_workers: 4
nstep: 3
batch_size: 256
# misc
profile_timings: false
seed: 42
device: cuda
save_video: true
save_train_video: false
use_tb: true
# experiment
experiment: exp
# agent
lr: 1e-4
feature_dim: 50
stddev_schedule: linear(1.0,0.1,500000)

agent:
  _target_: drqv2.DrQV2Agent
  obs_shape: ??? # to be specified later
  action_shape: ??? # to be specified later
  device: ${device}
  lr: ${lr}
  critic_target_tau: 0.01
  update_every_steps: 2
  use_tb: ${use_tb}
  profile_timings: ${profile_timings}
  num_expl_steps: 2000
  hidden_dim: 1024
  feature_dim: ${feature_dim}
  stddev_schedule: ${stddev_schedule}
  stddev_clip: 0.3

